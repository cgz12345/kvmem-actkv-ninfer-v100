<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee3f5"/>
      <stop offset="1" stop-color="#e8f7fd"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd68a"/>
      <stop offset="1" stop-color="#7cc46a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="45" fill="#ffe28a" opacity="0.9"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="160" cy="90" rx="55" ry="22"/>
      <ellipse cx="205" cy="78" rx="45" ry="20"/>
      <ellipse cx="120" cy="80" rx="40" ry="18"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 40 0; 0 0" dur="12s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.8">
      <ellipse cx="480" cy="140" rx="45" ry="17"/>
      <ellipse cx="520" cy="130" rx="35" ry="15"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -35 0; 0 0" dur="15s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Ground -->
  <rect x="0" y="470" width="800" height="130" fill="url(#grass)"/>
  <path d="M0 470 Q200 458 400 470 T800 470 L800 480 L0 480 Z" fill="#8fce79"/>

  <!-- Whole scene bobbing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0; 0 -3; 0 0" dur="1.2s" repeatCount="indefinite"/>

    <!-- ===== Bicycle ===== -->
    <g>
      <!-- Rear wheel -->
      <g>
        <circle cx="270" cy="470" r="68" fill="none" stroke="#3d3d3d" stroke-width="9"/>
        <circle cx="270" cy="470" r="56" fill="none" stroke="#cfd6dc" stroke-width="3"/>
        <g stroke="#8a94a0" stroke-width="4">
          <line x1="214" y1="470" x2="326" y2="470"/>
          <line x1="270" y1="414" x2="270" y2="526"/>
          <line x1="230" y1="430" x2="310" y2="510"/>
          <line x1="310" y1="430" x2="230" y2="510"/>
          <animateTransform attributeName="transform" type="rotate" from="0 270 470" to="360 270 470" dur="1s" repeatCount="indefinite"/>
        </g>
        <circle cx="270" cy="470" r="7" fill="#555"/>
      </g>

      <!-- Front wheel -->
      <g>
        <circle cx="560" cy="470" r="68" fill="none" stroke="#3d3d3d" stroke-width="9"/>
        <circle cx="560" cy="470" r="56" fill="none" stroke="#cfd6dc" stroke-width="3"/>
        <g stroke="#8a94a0" stroke-width="4">
          <line x1="504" y1="470" x2="616" y2="470"/>
          <line x1="560" y1="414" x2="560" y2="526"/>
          <line x1="520" y1="430" x2="600" y2="510"/>
          <line x1="600" y1="430" x2="520" y2="510"/>
          <animateTransform attributeName="transform" type="rotate" from="0 560 470" to="360 560 470" dur="1s" repeatCount="indefinite"/>
        </g>
        <circle cx="560" cy="470" r="7" fill="#555"/>
      </g>

      <!-- Frame -->
      <g stroke="#d63c3c" stroke-width="9" stroke-linecap="round" fill="none">
        <line x1="270" y1="470" x2="415" y2="458"/>   <!-- chainstay -->
        <line x1="270" y1="470" x2="392" y2="315"/>   <!-- seat stay -->
        <line x1="392" y1="315" x2="415" y2="458"/>   <!-- seat tube -->
        <line x1="415" y1="458" x2="532" y2="332"/>   <!-- down tube -->
        <line x1="394" y1="322" x2="534" y2="336"/>   <!-- top tube -->
        <line x1="532" y1="332" x2="560" y2="470"/>   <!-- fork -->
        <line x1="415" y1="458" x2="532" y2="332"/>
      </g>

      <!-- Seat post and saddle -->
      <line x1="392" y1="315" x2="388" y2="295" stroke="#555" stroke-width="7" stroke-linecap="round"/>
      <path d="M355 295 Q388 284 420 295 Q388 306 355 295 Z" fill="#4a4a4a"/>

      <!-- Handlebar -->
      <line x1="532" y1="332" x2="526" y2="300" stroke="#555" stroke-width="7" stroke-linecap="round"/>
      <path d="M526 300 Q522 288 508 290" stroke="#4a4a4a" stroke-width="7" fill="none" stroke-linecap="round"/>

      <!-- Crank + pedal -->
      <g>
        <line x1="415" y1="458" x2="445" y2="458" stroke="#333" stroke-width="7" stroke-linecap="round"/>
        <rect x="437" y="452" width="20" height="11" rx="3" fill="#222"/>
        <animateTransform attributeName="transform" type="rotate" from="0 415 458" to="360 415 458" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <circle cx="415" cy="458" r="8" fill="#333"/>

      <!-- ===== Pelican ===== -->
      <g>
        <!-- Tail -->
        <path d="M292 262 Q262 250 250 234 Q276 240 296 240 Z" fill="#e8eef2"/>

        <!-- Body -->
        <ellipse cx="356" cy="268" rx="78" ry="52" fill="#f4f8fb"/>
        <ellipse cx="340" cy="286" rx="52" ry="34" fill="#e8eef2" opacity="0.7"/>

        <!-- Wing -->
        <path d="M330 240 Q390 232 402 270 Q380 300 328 292 Q308 268 330 240 Z" fill="#dfe9f0"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 340 250; 4 340 250; 0 340 250" dur="1.2s" repeatCount="indefinite"/>
        </g>

        <!-- Neck -->
        <path d="M402 250 Q432 226 442 196 Q446 172 458 168" stroke="#f4f8fb" stroke-width="26" fill="none" stroke-linecap="round"/>

        <!-- Head -->
        <circle cx="462" cy="172" r="24" fill="#f4f8fb"/>

        <!-- Eye -->
        <circle cx="470" cy="164" r="5.5" fill="#ffffff"/>
        <circle cx="471.5" cy="164.5" r="3" fill="#222"/>

        <!-- Beak + pouch -->
        <path d="M476 158 Q540 158 592 190 Q560 196 536 194 L480 190 Q478 174 476 158 Z" fill="#f5a03c"/>
        <path d="M480 188 Q520 236 574 200 Q540 214 514 202 Q494 196 480 188 Z" fill="#ef8b2c"/>
        <path d="M476 158 Q540 158 592 190 Q560 196 536 194 L480 190" fill="#f7b45a" opacity="0.5"/>

        <!-- Pedaling leg -->
        <path d="M382 302 Q430 348 445 392 Q450 430 445 455"
              stroke="#f4f8fb" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
            values="M382 302 Q430 348 445 392 Q450 430 445 455;
                    M382 302 Q428 352 428 400 Q424 446 415 485;
                    M382 302 Q382 350 384 392 Q385 432 385 455;
                    M382 302 Q420 344 418 380 Q417 410 415 425;
                    M382 302 Q430 348 445 392 Q450 430 445 455"/>
        </path>
        <!-- Foot on pedal -->
        <path d="M437 450 L461 458" stroke="#f5a03c" stroke-width="9" stroke-linecap="round">
          <animate d="M437 450 L461 458; M407 480 L431 488; M377 450 L401 458; M407 420 L431 428; M437 450 L461 458" dur="1.2s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- Shadow on ground -->
    <ellipse cx="415" cy="545" rx="190" ry="14" fill="#5aa84f" opacity="0.45">
      <animate attributeName="rx" values="190; 182; 190" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>