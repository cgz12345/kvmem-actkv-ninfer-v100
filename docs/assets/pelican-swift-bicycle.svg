<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican riding a bicycle</title>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BEE3F4"/>
      <stop offset="1" stop-color="#EAF7FC"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4C8"/>
      <stop offset="1" stop-color="#FFD666"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)"/>

  <!-- sun -->
  <g stroke="#FFD97A" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <line x1="170" y1="95" x2="190" y2="95"/>
    <line x1="152" y1="53" x2="167" y2="38"/>
    <line x1="110" y1="35" x2="110" y2="15"/>
    <line x1="68"  y1="53" x2="53"  y2="38"/>
    <line x1="50"  y1="95" x2="30"  y2="95"/>
    <line x1="68"  y1="137" x2="53" y2="152"/>
    <line x1="110" y1="155" x2="110" y2="175"/>
    <line x1="152" y1="137" x2="167" y2="152"/>
    <animateTransform attributeName="transform" type="rotate" from="0 110 95" to="360 110 95" dur="80s" repeatCount="indefinite"/>
  </g>
  <circle cx="110" cy="95" r="44" fill="url(#sunGrad)"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.92">
    <g>
      <ellipse cx="0" cy="0" rx="40" ry="20"/><ellipse cx="32" cy="-10" rx="30" ry="17"/><ellipse cx="60" cy="0" rx="26" ry="14"/>
      <animateTransform attributeName="transform" type="translate" values="-150 105; 950 105" dur="42s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="0" rx="32" ry="16"/><ellipse cx="26" cy="-8" rx="24" ry="14"/><ellipse cx="48" cy="0" rx="20" ry="11"/>
      <animateTransform attributeName="transform" type="translate" values="-150 180; 950 180" dur="60s" begin="-28s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.8">
      <ellipse cx="0" cy="0" rx="26" ry="13"/><ellipse cx="22" cy="-7" rx="19" ry="11"/>
      <animateTransform attributeName="transform" type="translate" values="-130 70; 950 70" dur="75s" begin="-50s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ground and road -->
  <rect x="0" y="500" width="800" height="100" fill="#9FD49B"/>
  <rect x="-10" y="498" width="820" height="44" fill="#C7D2CE"/>
  <line x1="0" y1="499" x2="800" y2="499" stroke="#B0BDB8" stroke-width="2"/>
  <path d="M -20 520 H 820" stroke="#F4F7F6" stroke-width="5" stroke-dasharray="34 26" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="60" dur="0.85s" repeatCount="indefinite"/>
  </path>

  <!-- bushes, grass, flowers -->
  <ellipse cx="60"  cy="468" rx="40" ry="26" fill="#97CD92"/>
  <ellipse cx="735" cy="470" rx="45" ry="28" fill="#8FC78B"/>
  <g stroke="#6FA96B" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M90 565 C88 557 84 553 81 551 M90 565 C90 555 91 551 93 549 M90 565 C94 557 98 554 101 552"/>
    <path d="M170 580 C168 572 164 568 161 566 M170 580 C170 570 171 566 173 564 M170 580 C174 572 178 569 181 567"/>
    <path d="M620 575 C618 567 614 563 611 561 M620 575 C620 565 621 561 623 559 M620 575 C624 567 628 564 631 562"/>
    <path d="M720 562 C718 554 714 550 711 548 M720 562 C720 552 721 548 723 546 M720 562 C724 554 728 551 731 549"/>
  </g>
  <g>
    <circle cx="130" cy="578" r="5" fill="#F6A6C6"/><circle cx="130" cy="578" r="2" fill="#FFD666"/>
    <circle cx="55"  cy="585" r="5" fill="#F6A6C6"/><circle cx="55"  cy="585" r="2" fill="#FFD666"/>
    <circle cx="680" cy="585" r="5" fill="#F6A6C6"/><circle cx="680" cy="585" r="2" fill="#FFD666"/>
    <circle cx="765" cy="575" r="5" fill="#F6A6C6"/><circle cx="765" cy="575" r="2" fill="#FFD666"/>
  </g>

  <!-- shadow -->
  <ellipse cx="398" cy="527" rx="215" ry="13" fill="#2F3A42" opacity="0.14">
    <animate attributeName="rx" values="215;204;215" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="1.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- whole scene bobs gently -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="1.4s" repeatCount="indefinite"/>

    <!-- back leg -->
    <g>
      <path d="M312 318 Q346 368 352 428" stroke="#E08A33" stroke-width="13" stroke-linecap="round" fill="none">
        <animate attributeName="d" values="M312 318 Q346 368 352 428; M312 318 Q361 381 382 458; M312 318 Q349 399 352 488; M312 318 Q332 387 322 458; M312 318 Q346 368 352 428" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="1.4s" begin="-0.7s" repeatCount="indefinite"/>
      </path>
      <g fill="#E08A33">
        <path d="M-13 -4 Q-15 5 -5 7 L15 7 Q20 3 13 0 Q16 -5 6 -6 Q-5 -8 -13 -4 Z"/>
        <animateMotion dur="1.4s" begin="-0.7s" repeatCount="indefinite" path="M 352 428 a 30 30 0 0 1 30 30 a 30 30 0 0 1 -30 30 a 30 30 0 0 1 -30 -30 a 30 30 0 0 1 30 -30"/>
      </g>
    </g>

    <!-- bicycle -->
    <g>
      <!-- rear wheel -->
      <g>
        <circle cx="240" cy="452" r="62" fill="none" stroke="#39424B" stroke-width="13"/>
        <circle cx="240" cy="452" r="50" fill="none" stroke="#E7ECEF" stroke-width="5"/>
        <g stroke="#97A6B0" stroke-width="4" stroke-linecap="round">
          <line x1="240" y1="402" x2="240" y2="502"/><line x1="190" y1="452" x2="290" y2="452"/>
          <line x1="205" y1="417" x2="275" y2="487"/><line x1="275" y1="417" x2="205" y2="487"/>
        </g>
        <circle cx="240" cy="452" r="8" fill="#39424B"/>
        <animateTransform attributeName="transform" type="rotate" from="0 240 452" to="360 240 452" dur="1.4s" repeatCount="indefinite"/>
      </g>
      <!-- front wheel -->
      <g>
        <circle cx="565" cy="452" r="62" fill="none" stroke="#39424B" stroke-width="13"/>
        <circle cx="565" cy="452" r="50" fill="none" stroke="#E7ECEF" stroke-width="5"/>
        <g stroke="#97A6B0" stroke-width="4" stroke-linecap="round">
          <line x1="565" y1="402" x2="565" y2="502"/><line x1="515" y1="452" x2="615" y2="452"/>
          <line x1="530" y1="417" x2="600" y2="487"/><line x1="600" y1="417" x2="530" y2="487"/>
        </g>
        <circle cx="565" cy="452" r="8" fill="#39424B"/>
        <animateTransform attributeName="transform" type="rotate" from="0 565 452" to="360 565 452" dur="1.4s" repeatCount="indefinite"/>
      </g>

      <!-- frame -->
      <g stroke="#E5484D" stroke-width="11" stroke-linecap="round" fill="none">
        <line x1="352" y1="458" x2="545" y2="342"/>
        <line x1="352" y1="458" x2="322" y2="348"/>
        <line x1="322" y1="348" x2="545" y2="340"/>
        <line x1="352" y1="458" x2="240" y2="452"/>
        <line x1="240" y1="452" x2="322" y2="352"/>
        <line x1="547" y1="334" x2="565" y2="452"/>
      </g>
      <line x1="352" y1="458" x2="326" y2="340" stroke="#B93A3F" stroke-width="9" stroke-linecap="round"/>
      <rect x="294" y="321" width="56" height="14" rx="7" fill="#39424B"/>
      <line x1="547" y1="334" x2="542" y2="306" stroke="#39424B" stroke-width="8" stroke-linecap="round"/>
      <path d="M 542 306 Q 552 296 562 300" stroke="#39424B" stroke-width="9" stroke-linecap="round" fill="none"/>

      <!-- chainring + cranks -->
      <circle cx="352" cy="458" r="20" fill="#43505A" stroke="#2E373E" stroke-width="3"/>
      <g>
        <line x1="352" y1="458" x2="352" y2="428" stroke="#39424B" stroke-width="7" stroke-linecap="round"/>
        <line x1="352" y1="458" x2="352" y2="488" stroke="#39424B" stroke-width="7" stroke-linecap="round"/>
        <rect x="339" y="423" width="26" height="9" rx="4" fill="#2E373E"/>
        <rect x="339" y="484" width="26" height="9" rx="4" fill="#2E373E"/>
        <animateTransform attributeName="transform" type="rotate" from="0 352 458" to="360 352 458" dur="1.4s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- front leg -->
    <g>
      <path d="M312 318 Q346 368 352 428" stroke="#FFAD4D" stroke-width="13" stroke-linecap="round" fill="none">
        <animate attributeName="d" values="M312 318 Q346 368 352 428; M312 318 Q361 381 382 458; M312 318 Q349 399 352 488; M312 318 Q332 387 322 458; M312 318 Q346 368 352 428" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <g fill="#FFAD4D">
        <path d="M-13 -4 Q-15 5 -5 7 L15 7 Q20 3 13 0 Q16 -5 6 -6 Q-5 -8 -13 -4 Z"/>
        <animateMotion dur="1.4s" repeatCount="indefinite" path="M 352 428 a 30 30 0 0 1 30 30 a 30 30 0 0 1 -30 30 a 30 30 0 0 1 -30 -30 a 30 30 0 0 1 30 -30"/>
      </g>
    </g>

    <!-- pelican -->
    <g>
      <!-- tail -->
      <path d="M220 248 L170 258 L216 268 L178 282 L224 282 Z" fill="#EDF3F8"/>
      <!-- neck -->
      <path d="M306 214 C318 156 352 116 408 112" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" fill="none"/>
      <!-- body -->
      <ellipse cx="288" cy="252" rx="80" ry="64" fill="#FFFFFF" transform="rotate(-18 288 252)"/>
      <!-- wing (flaps gently) -->
      <g>
        <path d="M245 232 Q300 198 352 232 Q340 272 288 276 Q246 272 245 232 Z" fill="#E4ECF3"/>
        <animateTransform attributeName="transform" type="rotate" values="0 340 238; 9 340 238; 0 340 238" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="1.4s" repeatCount="indefinite"/>
      </g>
      <!-- head -->
      <circle cx="418" cy="114" r="36" fill="#FFFFFF"/>
      <!-- big orange beak with pouch -->
      <path d="M444 98 L598 126 Q604 136 590 141 C542 190 470 186 446 138 Z" fill="#FF9E42"/>
      <path d="M450 140 C486 174 542 176 586 140" stroke="#E8720C" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M448 112 L588 130" stroke="#E8720C" stroke-width="4" stroke-linecap="round" opacity="0.8" fill="none"/>
      <circle cx="468" cy="110" r="2.5" fill="#C25E08"/>
      <!-- eye (blinks) -->
      <g transform="translate(434 102)">
        <g>
          <ellipse cx="0" cy="0" rx="7" ry="7" fill="#FFFFFF" stroke="#D8E2E8" stroke-width="1"/>
          <circle cx="2" cy="0" r="3.4" fill="#22303A"/>
          <circle cx="0.5" cy="-2" r="1.3" fill="#FFFFFF"/>
          <animateTransform attributeName="transform" type="scale" values="1 1; 1 1; 1 0.1; 1 1" keyTimes="0;0.9;0.94;1" dur="4.2s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
  </g>
</svg>