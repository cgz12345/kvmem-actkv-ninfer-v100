<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#e0f7fa"/>
  
  <!-- Ground -->
  <rect y="500" width="800" height="100" fill="#a5d6a7"/>

  <!-- Bicycle Group -->
  <g id="bicycle">
    <!-- Rear Wheel -->
    <circle cx="250" cy="450" r="70" fill="none" stroke="#333" stroke-width="8"/>
    <circle cx="250" cy="450" r="5" fill="#333"/>
    
    <!-- Front Wheel -->
    <circle cx="550" cy="450" r="70" fill="none" stroke="#333" stroke-width="8"/>
    <circle cx="550" cy="450" r="5" fill="#333"/>
    
    <!-- Frame -->
    <!-- Chainstay (Rear axle to bottom bracket) -->
    <line x1="250" y1="450" x2="380" y2="450" stroke="#d32f2f" stroke-width="10" stroke-linecap="round"/>
    <!-- Seatstay (Rear axle to seat post) -->
    <line x1="250" y1="450" x2="320" y2="320" stroke="#d32f2f" stroke-width="10" stroke-linecap="round"/>
    <!-- Down tube (Bottom bracket to head tube) -->
    <line x1="380" y1="450" x2="480" y2="320" stroke="#d32f2f" stroke-width="10" stroke-linecap="round"/>
    <!-- Top tube (Seat post to head tube) -->
    <line x1="320" y1="320" x2="480" y2="320" stroke="#d32f2f" stroke-width="10" stroke-linecap="round"/>
    <!-- Seat post -->
    <line x1="320" y1="320" x2="310" y2="290" stroke="#333" stroke-width="8" stroke-linecap="round"/>
    <!-- Head tube / Fork -->
    <line x1="480" y1="320" x2="490" y2="280" stroke="#333" stroke-width="8" stroke-linecap="round"/>
    <line x1="490" y1="280" x2="550" y2="450" stroke="#333" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Saddle -->
    <path d="M 290 290 Q 310 280 330 290 Q 310 300 290 290 Z" fill="#333"/>
    
    <!-- Handlebars -->
    <path d="M 490 280 Q 480 260 460 260" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Crank and Pedals -->
    <circle cx="380" cy="450" r="15" fill="none" stroke="#333" stroke-width="5"/>
    <line x1="380" y1="450" x2="360" y2="480" stroke="#333" stroke-width="5"/>
    <rect x="350" y="475" width="20" height="8" fill="#333" rx="2"/>
    <line x1="380" y1="450" x2="400" y2="420" stroke="#333" stroke-width="5"/>
    <rect x="390" y="415" width="20" height="8" fill="#333" rx="2"/>
  </g>

  <!-- Pelican Group -->
  <g id="pelican">
    <!-- Tail feathers -->
    <path d="M 280 320 Q 240 340 220 360 Q 250 350 280 330 Z" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>
    
    <!-- Body -->
    <ellipse cx="300" cy="320" rx="60" ry="40" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>
    
    <!-- Wing -->
    <path d="M 280 300 Q 320 280 350 310 Q 320 330 280 320 Z" fill="#eeeeee" stroke="#cccccc" stroke-width="2"/>
    
    <!-- Legs -->
    <!-- Back leg (pedaling up) -->
    <line x1="310" y1="350" x2="390" y2="420" stroke="#ff9800" stroke-width="6" stroke-linecap="round"/>
    <!-- Front leg (pedaling down) -->
    <line x1="300" y1="350" x2="360" y2="480" stroke="#ff9800" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Feet -->
    <path d="M 355 475 L 375 475 L 365 485 Z" fill="#ff9800"/>
    <path d="M 385 415 L 405 415 L 395 425 Z" fill="#ff9800"/>

    <!-- Neck -->
    <path d="M 340 300 Q 380 250 390 200 Q 400 150 420 120" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="420" cy="110" r="25" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>
    
    <!-- Beak -->
    <!-- Upper beak -->
    <path d="M 435 105 L 520 115 L 435 115 Z" fill="#ffb300" stroke="#e65100" stroke-width="1"/>
    <!-- Lower pouch -->
    <path d="M 435 115 Q 480 160 520 115 Z" fill="#ffb300" stroke="#e65100" stroke-width="1"/>
    
    <!-- Eye -->
    <circle cx="425" cy="105" r="4" fill="#333"/>
    <circle cx="426" cy="104" r="1.5" fill="#fff"/>
  </g>
</svg>